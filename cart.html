<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cart | FILEX TRONICS</title>
<meta name="theme-color" content="#07070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="wrap">
      <span class="eyebrow">Your order</span>
      <h1>Shopping <span class="gold-text">cart</span></h1>
    </div>
  </section>

  <section class="sec">
    <div class="wrap cart-grid">
      <div class="lines" id="lines"></div>
      <aside class="summary" id="summary" aria-label="Order summary" hidden>
        <div class="sum"><span>Subtotal</span><b id="sub">TZS 0</b></div>
        <p class="sub">Final price, stock and delivery are confirmed with you on WhatsApp.</p>
        <a class="btn wa" id="waOrder" href="#" target="_blank" rel="noopener">Order cart on WhatsApp</a>
        <button class="btn sm" id="clear" type="button">Clear cart</button>
      </aside>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/art.js"></script>
<script src="js/common.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
